<li><strong>Chamar APIs de LLM</strong> — os dois padrões de indústria (OpenAI e Anthropic) e o wire format por baixo dos SDKs.</li>
<li><strong>Gerir entrada e saída</strong> — histórico de mensagens e janela de contexto, vistos e medidos em código.</li>
<li><strong>Construir um agente em loop</strong> — objetivo, iteração, dispatch de tools e parada validável.</li>
<li><strong>Colocar o humano no loop</strong> — gate de aprovação (HITL) como parte do IO do agente.</li>
</ol>
<p>Material (código da aula): <strong>github.com/elderbernardiifsul/prog-agentica-helloLLM</strong></p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>

<h2 id="revis%C3%A3o-o-la%C3%A7o-de-controle">Revisão: o laço de controle</h2>
<div class="kicker">Aula 02, slide 23 — hoje cada seta vira código</div>
<p><strong>decisão → ação → observação → estado</strong></p>
<ul>
<li>O <strong>modelo</strong> decide (propõe texto ou pedido de ferramenta).</li>
<li>O <strong>runtime</strong> age (executa a ferramenta de verdade).</li>
<li>O resultado volta como <strong>observação</strong> (nova mensagem no contexto).</li>
<li>O <strong>estado</strong> determina: continuar, ou parar por sucesso / limite / erro.</li>
</ul>
<p>Hoje: runtime = ~80 linhas de JavaScript escritas por vocês.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="estrutura-da-requisi%C3%A7%C3%A3o">Estrutura da requisição</h2>
<div class="kicker">Degrau 01 · o request</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http">POST /chat/completions
<span class="hljs-attribute">Authorization</span><span class="hljs-punctuation">: </span>Bearer &lt;chave&gt;
<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/json
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;model&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;gemini-2.5-flash&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;messages&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span>
    <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;system&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Você é um assistente conciso.&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
    <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;user&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;O que é uma janela de contexto?&quot;</span> <span class="hljs-punctuation">}</span>
  <span class="hljs-punctuation">]</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<p>Três roles até aqui: <code>system</code> (regras), <code>user</code> (pedido), <code>assistant</code> (respostas do modelo).</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="estrutura-da-resposta">Estrutura da resposta</h2>
<div class="kicker">Degrau 01 · o response</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;choices&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;assistant&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;É o limite de tokens...&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;finish_reason&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;stop&quot;</span>
  <span class="hljs-punctuation">}</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;usage&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;prompt_tokens&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">28</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;completion_tokens&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">31</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;total_tokens&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">59</span> <span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<ul>
<li><code>choices[0].message</code> — a resposta (entra no histórico).</li>
<li><code>finish_reason</code> — por que parou: <code>stop</code>, <code>tool_calls</code>, <code>length</code>.</li>
<li><code>usage</code> — <strong>o custo</strong>. Cada token de entrada e saída é cobrado.</li>
</ul>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="padr%C3%B5es-de-api-openai-e-anthropic">Padrões de API: OpenAI e Anthropic</h2>
<div class="kicker">OpenAI chat completions × Anthropic Messages</div>
<table>
<thead>
<tr>
<th>Aspecto</th>
<th>OpenAI</th>
<th>Anthropic</th>
</tr>
</thead>
<tbody>
<tr>
<td>Endpoint</td>
<td><code>POST /chat/completions</code></td>
<td><code>POST /v1/messages</code></td>
</tr>
<tr>
<td>Auth</td>
<td><code>Authorization: Bearer</code></td>
<td><code>x-api-key</code></td>
</tr>
<tr>
<td>System prompt</td>
<td>mensagem na lista</td>
<td>parâmetro <code>system</code> próprio</td>
</tr>
<tr>
<td><code>max_tokens</code></td>
<td>opcional</td>
<td><strong>obrigatório</strong></td>
</tr>
<tr>
<td>Resposta</td>
<td><code>content</code> string</td>
<td><code>content</code> = lista de blocos</td>
</tr>
<tr>
<td>Tool: declaração</td>
<td><code>function.parameters</code></td>
<td><code>input_schema</code></td>
</tr>
<tr>
<td>Tool: pedido</td>
<td><code>tool_calls</code> + role <code>tool</code></td>
<td>bloco <code>tool_use</code> + bloco <code>tool_result</code></td>
</tr>
<tr>
<td>Usage</td>
<td><code>prompt/completion_tokens</code></td>
<td><code>input/output_tokens</code></td>
</tr>
</tbody>
</table>
<p>Mesmos conceitos, formatos diferentes. Código comentado: <code>02b-sdk-anthropic.mjs</code>.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="compatibilidade-entre-provedores">Compatibilidade entre provedores</h2>
<div class="kicker">Por que a aula usa Gemini com SDK OpenAI</div>
<p>Gemini, Ollama, Mistral e vLLM expõem endpoints <strong>compatíveis com o formato OpenAI</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> client = <span class="hljs-keyword">new</span> <span class="hljs-title class_">OpenAI</span>({
  <span class="hljs-attr">apiKey</span>: process.<span class="hljs-property">env</span>.<span class="hljs-property">GEMINI_API_KEY</span>,
  <span class="hljs-attr">baseURL</span>: <span class="hljs-string">&quot;https://generativelanguage.googleapis.com/v1beta/openai&quot;</span>,
});
</code></pre>
<p>Trocar de provedor = trocar <code>baseURL</code> (e a chave). O código não muda.</p>
<p>É a mesma razão pela qual aprender <strong>um</strong> wire format rende: ele é o dialeto comum do ecossistema.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="demonstra%C3%A7%C3%A3o-o-sdk-e-suas-abstra%C3%A7%C3%B5es-degrau-02">Demonstração: o SDK e suas abstrações (degrau 02)</h2>
<div class="kicker">repo prog-agentica-helloLLM · 02-sdk-openai.mjs</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> resposta = <span class="hljs-keyword">await</span> client.<span class="hljs-property">chat</span>.<span class="hljs-property">completions</span>.<span class="hljs-title function_">create</span>({ model, messages });
</code></pre>
<p>O SDK fez por você: URL + headers, JSON, <strong>retries com backoff</strong> (429/5xx), timeouts, erros tipados.</p>
<p>O que ele <strong>não</strong> fez: decidir o que entra em <code>messages</code>, quando parar, o que fazer com a resposta. Isso é o seu programa — e é o assunto do resto da aula.</p>
<p>O outro formato: <code>npm run 02b</code> — o contraste Anthropic, comentado linha a linha.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="frameworks-de-agentes-escopo-e-adiamento">Frameworks de agentes: escopo e adiamento</h2>
<div class="kicker">LangChain · LangGraph · Vercel AI SDK</div>
<ul>
<li>São <strong>embalagens do loop</strong> que vamos construir hoje: abstraem histórico, tools, dispatch e parada.</li>
<li>Úteis em produção; péssimos como primeira exposição — escondem exatamente o que precisamos entender.</li>
<li>Depois de hoje, vocês saberão <strong>o que</strong> eles abstraem — e poderão julgar <strong>quando</strong> valem a pena.</li>
</ul>
<p>Hoje: zero frameworks. SDK + código nosso.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="gest%C3%A3o-do-hist%C3%B3rico-de-mensagens">Gestão do histórico de mensagens</h2>
<div class="kicker">Degrau 03 · o modelo não lembra de nada</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> historico = [{ <span class="hljs-attr">role</span>: <span class="hljs-string">&quot;system&quot;</span>, <span class="hljs-attr">content</span>: <span class="hljs-string">&quot;...&quot;</span> }];
<span class="hljs-comment">// a cada turno:</span>
historico.<span class="hljs-title function_">push</span>({ <span class="hljs-attr">role</span>: <span class="hljs-string">&quot;user&quot;</span>, <span class="hljs-attr">content</span>: entrada });
<span class="hljs-keyword">const</span> resposta = <span class="hljs-keyword">await</span> client.<span class="hljs-property">chat</span>.<span class="hljs-property">completions</span>.<span class="hljs-title function_">create</span>({ model, <span class="hljs-attr">messages</span>: historico });
historico.<span class="hljs-title function_">push</span>(resposta.<span class="hljs-property">choices</span>[<span class="hljs-number">0</span>].<span class="hljs-property">message</span>);   <span class="hljs-comment">// ← sem isto, &quot;amnésia&quot;</span>
</code></pre>
<p>A &quot;memória&quot; do chat <strong>é este array</strong>. A API não guarda nada entre chamadas.</p>
<p>Esquecer o push do assistant = modelo que não lembra do que ele mesmo disse.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="demonstra%C3%A7%C3%A3o-chat-com-hist%C3%B3rico-degrau-03">Demonstração: chat com histórico (degrau 03)</h2>
<div class="kicker">repo prog-agentica-helloLLM · 03-chat-readline.mjs</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run 03
</code></pre>
<p>Roteiro:</p>
<ol>
<li><code>meu nome é &lt;nome&gt;</code> — depois pergunte algo qualquer, depois <code>qual é meu nome?</code> → ele lembra (o array funciona).</li>
<li>Observar a linha de status: <code>prompt_tokens</code> <strong>cresce a cada turno</strong>.</li>
</ol>
<p>Pergunta pra turma: quem está pagando pelos tokens do histórico reenviado?</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="montagem-do-prompt-e-janela-de-contexto">Montagem do prompt e janela de contexto</h2>
<div class="kicker">Degrau 03b · montagem do prompt</div>
<p>A cada chamada, o modelo vê <strong>um único texto montado</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[ system ] + [ histórico inteiro ] + [ tool defs ] + [ mensagem nova ]
                            ↓
                         modelo
                            ↓
                        resposta
</code></pre>
<ul>
<li>A API é <strong>stateless</strong>: tudo é reenviado, sempre.</li>
<li>A <strong>janela de contexto</strong> é o limite de tokens dessa montagem (+ resposta).</li>
</ul>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="limites-da-janela-e-estrat%C3%A9gias-de-gest%C3%A3o">Limites da janela e estratégias de gestão</h2>
<ul>
<li>Modelos atuais: de ~128K a ~1M tokens de janela.</li>
<li>Quando estoura: erro da API, ou o provedor corta — <strong>algo fica de fora</strong>.</li>
<li>Quem decide o que fica é o <strong>seu código</strong>: trimming (cortar o mais antigo), sumarização, compaction.</li>
<li>Gancho da aula 02: é aqui que a <strong>engenharia de contexto</strong> deixa de ser abstrata.</li>
</ul>
<p>Custo mora no mesmo lugar: histórico longo = <code>prompt_tokens</code> alto <strong>em toda chamada</strong>.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="demonstra%C3%A7%C3%A3o-limite-da-janela-de-contexto-degrau-03b">Demonstração: limite da janela de contexto (degrau 03b)</h2>
<div class="kicker">repo prog-agentica-helloLLM · 03b-janela-contexto.mjs · janela simulada de 250 tokens</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run 03b
</code></pre>
<ol>
<li><code>meu nome é &lt;nome&gt;</code></li>
<li>Peça 2-3 respostas longas (&quot;explique HTTP em detalhes&quot;).</li>
<li>Linhas <code>✂ caiu para fora da janela</code> começam a aparecer.</li>
<li><code>qual é meu nome?</code> → <strong>ele esqueceu</strong>. O nome saiu da janela.</li>
</ol>
<p>O dump <code>┌── CONTEXTO QUE SERÁ ENVIADO ──</code> mostra exatamente o que o modelo vê.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="tool-calling-fronteira-entre-modelo-e-runtime">Tool calling: fronteira entre modelo e runtime</h2>
<div class="kicker">Degrau 04 · a fronteira modelo / runtime (aula 02, slide 19)</div>
<ul>
<li>O modelo <strong>emite um pedido estruturado</strong>: &quot;chamem <code>somar</code> com <code>{a: 2, b: 3}</code>&quot;.</li>
<li>O <strong>seu código</strong> decide executar, executa, e devolve o resultado como mensagem.</li>
<li>O modelo <strong>nunca toca o mundo</strong> — nem arquivos, nem rede, nem terminal.</li>
</ul>
<p>Consequência: todo poder do agente é poder que <strong>você</strong> deu, tool por tool. (Menor privilégio, aula 02.)</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="declara%C3%A7%C3%A3o-de-ferramentas-por-schema">Declaração de ferramentas por schema</h2>
<div class="kicker">Um schema JSON — é TUDO que o modelo vê</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">{
  <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;function&quot;</span>,
  <span class="hljs-attr">function</span>: {
    <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;somar&quot;</span>,
    <span class="hljs-attr">description</span>: <span class="hljs-string">&quot;Soma dois números com precisão exata.&quot;</span>,
    <span class="hljs-attr">parameters</span>: {
      <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;object&quot;</span>,
      <span class="hljs-attr">properties</span>: { <span class="hljs-attr">a</span>: { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;number&quot;</span> }, <span class="hljs-attr">b</span>: { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;number&quot;</span> } },
      <span class="hljs-attr">required</span>: [<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>],
    },
  },
}
</code></pre>
<p>A <code>description</code> é interface <strong>para o modelo</strong>: escreva-a para ele saber <em>quando</em> usar a tool.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="o-ciclo-de-tool-calling">O ciclo de tool calling</h2>
<div class="kicker">Uma volta, quatro mensagens</div>
<ol>
<li><code>user</code>: &quot;Quanto é 123456 + 654321? Use a ferramenta.&quot;</li>
<li><code>assistant</code>: <code>tool_calls: [{ id, function: { name: &quot;somar&quot;, arguments: '{&quot;a&quot;:123456,...}' } }]</code> — <code>finish_reason: &quot;tool_calls&quot;</code></li>
<li><strong>Seu código</strong>: <code>JSON.parse(arguments)</code> → executa → <code>{ role: &quot;tool&quot;, tool_call_id: id, content: &quot;777777&quot; }</code></li>
<li><code>assistant</code>: &quot;O resultado é 777.777.&quot;</li>
</ol>
<p>Tudo isso <strong>entra no histórico</strong> — o ciclo é feito de mensagens.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="demonstra%C3%A7%C3%A3o-ciclo-manual-de-tool-calling-degrau-04">Demonstração: ciclo manual de tool calling (degrau 04)</h2>
<div class="kicker">repo prog-agentica-helloLLM · 04-tool-calling.mjs</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run 04
</code></pre>
<p>O que observar:</p>
<ul>
<li><code>finish_reason: &quot;tool_calls&quot;</code> — o modelo <strong>parou para pedir</strong>.</li>
<li><code>arguments</code> chega como <strong>string</strong> → <code>JSON.parse</code> + validação sempre (o modelo pode mandar lixo).</li>
<li>O <code>tool_call_id</code> amarra pedido e resultado.</li>
<li>Segunda chamada: o modelo lê o resultado e responde ao usuário.</li>
</ul>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="requisitos-para-construir-um-agente">Requisitos para construir um agente</h2>
<div class="kicker">Três ingredientes</div>
<ol>
<li><strong>Objetivo</strong> — uma missão no <code>system</code>/<code>user</code> (&quot;adivinhe o número&quot;; &quot;monte o projeto&quot;).</li>
<li><strong>Iteração</strong> — um <code>while</code> em volta do ciclo do degrau 04: agir, observar, agir de novo.</li>
<li><strong>Parada validável</strong> — condição objetiva para <code>sucesso</code>, <code>limite</code> e <code>erro</code>.</li>
</ol>
<p>Agente = modelo + tools + <strong>loop com critérios de parada</strong>. É isso. O resto é sofisticação.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="estrutura-do-agent-loop">Estrutura do agent loop</h2>
<div class="kicker">O coração, em 12 linhas</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> estadoFinal = <span class="hljs-literal">null</span>;                    <span class="hljs-comment">// &quot;sucesso&quot; | &quot;limite&quot; | &quot;erro&quot;</span>
<span class="hljs-keyword">let</span> passo = <span class="hljs-number">0</span>;
<span class="hljs-keyword">while</span> (estadoFinal === <span class="hljs-literal">null</span>) {
  passo++;
  <span class="hljs-keyword">if</span> (passo &gt; <span class="hljs-variable constant_">MAX_PASSOS</span>) { estadoFinal = <span class="hljs-string">&quot;limite&quot;</span>; <span class="hljs-keyword">break</span>; }
  <span class="hljs-keyword">const</span> r = <span class="hljs-keyword">await</span> client.<span class="hljs-property">chat</span>.<span class="hljs-property">completions</span>.<span class="hljs-title function_">create</span>({ model, messages, tools });
  <span class="hljs-keyword">const</span> msg = r.<span class="hljs-property">choices</span>[<span class="hljs-number">0</span>].<span class="hljs-property">message</span>;
  messages.<span class="hljs-title function_">push</span>(msg);
  <span class="hljs-keyword">if</span> (!msg.<span class="hljs-property">tool_calls</span>) { <span class="hljs-comment">/* modelo conversou: reorientar e continuar */</span> <span class="hljs-keyword">continue</span>; }
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> call <span class="hljs-keyword">of</span> msg.<span class="hljs-property">tool_calls</span>) {
    <span class="hljs-comment">/* dispatch: executar, tracear, push do tool result, checar sucesso */</span>
  }
}
</code></pre>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="crit%C3%A9rios-de-parada">Critérios de parada</h2>
<div class="kicker">Sem eles, não há agente — há um gerador de custo</div>
<table>
<thead>
<tr>
<th>Estado</th>
<th>Gatilho</th>
<th>Sem ele...</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>sucesso</code></td>
<td>objetivo <strong>verificado</strong> (tool <code>finalizar</code>, checagem)</td>
<td>agente não sabe que acabou</td>
</tr>
<tr>
<td><code>limite</code></td>
<td><code>passo &gt; MAX_PASSOS</code></td>
<td>loop infinito, conta infinita</td>
</tr>
<tr>
<td><code>erro</code></td>
<td>exceção da API / tool irrecuperável</td>
<td>crash sem trace</td>
</tr>
</tbody>
</table>
<p>E o caso chato: o modelo <strong>conversa em vez de agir</strong> → reinjetar instrução (&quot;continue: use a tool&quot;) e seguir o loop.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="registro-de-execu%C3%A7%C3%A3o-trace">Registro de execução (trace)</h2>
<div class="kicker">Formato da disciplina</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[passo 3] chute 50 -&gt; maior
[passo 4] chute 75 -&gt; menor
[passo 5] chute 62 -&gt; acertou

== FIM: sucesso em 5 passo(s) ==
</code></pre>
<ul>
<li>Uma linha por ação: <code>[passo N] ação -&gt; observação</code>.</li>
<li>Sem trace não há depuração, não há auditoria, não há evidência.</li>
<li>É o que você entrega na atividade EaD — e o que os harnesses geram sozinhos (aula 04).</li>
</ul>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-class="question" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" class="question" data-marpit-pagination="26" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--class:question;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9"><div class="kicker">MINI-LAB · 45 min</div>
<h1 id="o-loop-do-jogo">O loop do jogo</h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="s%C3%ADntese-do-mini-laborat%C3%B3rio">Síntese do mini-laboratório</h2>
<div class="kicker">Mapa do lab para o diagrama</div>
<ul>
<li><code>while (estadoFinal === null)</code> — o <strong>laço de controle</strong> inteiro.</li>
<li>Chamada à API — a <strong>decisão</strong> do modelo.</li>
<li><code>chutar()</code> no seu código — a <strong>ação</strong> no mundo.</li>
<li>Push do tool result — a <strong>observação</strong> que realimenta o contexto.</li>
<li><code>estadoFinal</code> — o <strong>estado</strong> que decide parar.</li>
</ul>
<p>Pergunta: onde entraria uma <strong>segunda tool</strong>? (Resposta prática: daqui a pouco, no agente de arquivos.)</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="interven%C3%A7%C3%A3o-humana-no-la%C3%A7o-hitl">Intervenção humana no laço (HITL)</h2>
<div class="kicker">Human-in-the-loop · por quê e onde</div>
<ul>
<li><strong>Por quê</strong>: ações irreversíveis (escrever, apagar, pagar), menor privilégio, e a regra da disciplina — <em>o estudante responde pelo resultado entregue</em>.</li>
<li><strong>Onde</strong>: um gate <strong>antes do efeito</strong> — o pedido da tool é mostrado ao humano; só executa com aprovação.</li>
<li>A recusa <strong>não encerra o agente</strong>: vira observação (<code>NEGADO pelo humano: &lt;motivo&gt;</code>) que o modelo usa para replanejar.</li>
</ul>
<p>Aprovar · corrigir · interromper — os três verbos da intervenção (matriz de competências).</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="IFSul · Ciência da Computação · Programação Agêntica · Aula 03" data-theme="pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--footer:IFSul · Ciência da Computação · Programação Agêntica · Aula 03;--theme:pph1fvv5dnt7qu0s8itmgyjcfwtx92qrjnuvz4gu9sa;" data-marpit-pagination-total="33" data-size="16:9">
<h2 id="demonstra%C3%A7%C3%A3o-gate-de-aprova%C3%A7%C3%A3o-humana-degrau-07">Demonstração: gate de aprovação humana (degrau 07)</h2>
<div class="kicker">repo prog-agentica-helloLLM · 07-hitl.mjs · missão: escrever um haicai</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run 07
</code></pre>
<p>Rodada 1 — aprovar (<code>s</code>): arquivo escrito, missão concluída.</p>
<p>Rodada 2 — negar (<code>n</code>) com motivo <em>&quot;quero em inglês&quot;</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[passo 2] [INTERVENÇÃO] escrita negada: quero em inglês
[passo 3] escrever({&quot;caminho&quot;:&quot;poema.md&quot;,...}) -&gt; ok: poema.md
</code></pre>
<p>O agente <strong>leu o motivo e ajustou</strong>. O humano é parte do IO.</p>
<footer>IFSul · Ciência da Computação · Programação Agêntica · Aula 03</footer>
</section>

<h2 id="atividade-ead--agente-de-arquivos">Atividade EaD — agente de arquivos</h2>
<div class="kicker">Prazo: 2 semanas · enunciado completo: docs/atividade-ead-agente-arquivos.md no repo</div>
<p>Missão real: montar um pacote Node (<code>workspace-demo</code>) dentro de uma sandbox — verificado por script (<code>npm run verificar</code>).</p>
<ol>
<li><strong>Núcleo</strong> — completar TODOs 1..4 de <code>06-agente-arquivos/agente.mjs</code> até <code>MISSÃO CUMPRIDA <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></code>.</li>
<li><strong>Extensões obrigatórias</strong> — gate HITL na tool <code>escrever</code> (com 1 intervenção real no trace) + <strong>uma tool nova de autoria própria</strong> (schema + validação + executor).</li>
<li><strong>Registro</strong> — <code>relatorio.md</code>: trace comentado, decisão da tool nova, retirada.</li>
</ol>
<p>Trace inventado ou verificador adulterado = atividade zerada.</p>

<h2 id="retirada">Retirada</h2>
<div class="kicker">Fechamento</div>
<ul>
<li>Do loop que você escreveu hoje: o que sabe reescrever <strong>do zero, sem assistente</strong>?</li>
<li>O que muda no seu código se trocarmos <code>gemini-2.5-flash</code> por outro modelo? E o que <strong>não</strong> muda?</li>
<li>Onde o custo mora? (Duas respostas certas: histórico reenviado; loop sem limite.)</li>
</ul>
<p><strong>Aula 04</strong>: OpenCode — loop, tools, permissões, trace e HITL de hoje, embalados num harness profissional. Vocês vão reconhecer cada peça.</p>

<h2 id="nota-sobre-produ%C3%A7%C3%A3o-com-ia-generativa">Nota sobre produção com IA generativa</h2>
<div class="kicker">Transparência</div>
<ul>
<li>A <strong>direção pedagógica</strong>, as <strong>ideias de conteúdo</strong>, a <strong>sequência didática</strong> e as <strong>atividades</strong> desta aula são do professor.</li>
<li>O material (texto, código e slides) foi <strong>produzido com apoio de IA generativa</strong>, em sessão com forte <strong>HITL</strong>: supervisão contínua, decisões, revisões e ajustes diretos no texto pelo professor.</li>
<li>Coerência com a disciplina: é exatamente o fluxo de trabalho que estudamos — agente produz, humano dirige, intervém e responde pelo resultado.</li>
</ul>
